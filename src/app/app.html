@if(loginService.user()) {
    <mat-toolbar>
        <button mat-icon-button (click)="navigatePokemonList()">
            <mat-icon>Home</mat-icon>
        </button>
        <p>
            Welcome {{ loginService.user()?.username }}
        </p>
        <button mat-flat-button class="warn" (click)="logout()">Logout</button>
    </mat-toolbar>
}
