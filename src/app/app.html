<!--<app-search-bar />-->

<div class="card-list-content">
    <!-- <button> Toggle Pokemon</button>-->
    <div class="search-bar-content">
        <app-search-bar [(search)]="search" />
    </div>

    <div class="card-list">

        @for(pokemon of filtredPokemon(); track pokemon) {
        <app-cards [pokemon]="pokemon" />
        } @empty {
        <div class="no-pokemon-found">
            <p>Aucun pokemon trouvé</p>
        </div>

        }

    </div>
    <div class="pokemon-found">
        @if(filtredPokemon().length > 0) {
        <p>{{ filtredPokemon().length }} pokemon trouvé !</p>
        }
    </div>
</div>
