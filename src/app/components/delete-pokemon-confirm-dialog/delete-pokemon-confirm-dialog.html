<h2 mat-dialog-title>Supprimer un pokemon</h2>
<mat-dialog-content>
    <p>Voulez-vous supprimer le pokemon sélectionné ?</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton [matDialogClose]="false">Non</button>
    <button matButton [mat-dialog-close]="true">Oui</button>
</mat-dialog-actions>
