
<div class="cards-content">

    <mat-card appearance="outlined" [style.background]="backgroundColor()">
        <mat-card-header>
            <mat-card-title>{{ pokemon().name }}</mat-card-title>
            <mat-card-title>{{ pokemon().hp }} HP</mat-card-title>
        </mat-card-header>
        <div class="middle-content">
            <div class="picture">
                <img mat-card-image [src]="pokemon().imageUrl"
                    alt="Photo of a Shiba Inu">
            </div>
            <div class="num-pokemon">
                <p>{{ pokemon().num }} Monster</p>
            </div>
        </div>

        <mat-card-content class="card-content">
            <div class="capacities-content">
                <p>{{ pokemon().capacityNmae }}</p>
                <p>{{ pokemon().capacityPower }}</p>
            </div>
            <div class="description">
                <p>{{ pokemon().capacityDescription }}</p>
            </div>

        </mat-card-content>
    </mat-card>

</div>
